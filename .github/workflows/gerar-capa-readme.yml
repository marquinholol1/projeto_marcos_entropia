name: Gerar capa animada do README

on:
  push:
    branches: [main]
    paths:
      - "tools/gerar_capa_readme.py"
      - ".github/workflows/gerar-capa-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-capa:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --upgrade pillow

      - name: Gerar GIF
        run: python tools/gerar_capa_readme.py

      - name: Publicar GIF no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/capa_dissertacao_entropia.gif
          if git diff --cached --quiet; then
            echo "A capa já está atualizada."
          else
            git commit -m "Gera capa animada do README"
            git push
          fi
